    lang: go
    outputs: [dnstrace]
    arm_outputs: same
    test_cmd: '/out/x64/dnstrace -h 2>&1 | grep -qiE "usage|query"'
  - name: dnstt_client
    version: "1.20260501.0"
    check: {type: git-remote, remote: 'https://www.bamsoftware.com/git/dnstt.git', pattern: '^v(.+)$'}
    lang: go
    outputs: [{bin: dnstt_client, dst: dnstt_client}, {bin: dnstt_server, dst: dnstt_server}]
    arm_outputs: [{bin: dnstt_client, dst: dnstt_client}, {bin: dnstt_server, dst: dnstt_server}]
    test: "-h"
  - name: doggo
    version: "1.4.0"
    check: {type: github-release, slug: mr-karan/doggo}
    lang: go
    outputs: [doggo]
    arm_outputs: same
