    version: "2.0"
    check: {type: github-tag, slug: bryanpkc/corkscrew}
    lang: c
    outputs: [corkscrew]
    arm_outputs: same
    test_cmd: '/out/x64/corkscrew -h 2>&1 | grep -qiE "usage|corkscrew" || /out/x64/corkscrew 2>&1 | grep -qiE "usage|corkscrew"'
  - name: curl
    version: "8.21.0"
    check: {type: github-tag, slug: curl/curl, pattern: '^curl-(\d+_\d+_\d+)$', transform: underscore_to_dot}
    lang: c
    outputs: [curl]
    arm_outputs: same
    arm_frozen: no ARM cross for the openssl/nghttp2 stack
    test: "--version"
  - name: dh
    version: "1.12"
    check: {type: pinned, reason: upstream versions via rN git tags only}
    lang: c
    outputs: [dh]
    arm_outputs: same
    test_cmd: "timeout 2 /out/x64/dh --pidfile /tmp/dh.pid --port 18080 127.0.0.1 >/dev/null 2>&1 & sleep 1; wget -qO- http://127.0.0.1:18080/ || true; kill %1 2>/dev/null; true"
  - name: dnsmonster
    version: "1.2.5"
    check: {type: github-release, slug: FenkoHQ/dnsmonster}
    lang: go
    outputs: [dnsmonster]
    arm_outputs: same
