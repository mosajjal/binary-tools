# binary-tools master manifest
#
# Single source of truth for upstream tracking + automated builds.
#   scripts/check_upstream.py reads `check` blocks to find newer versions.
#   .github/workflows/upstream-bump.yml builds updated tools via
#   build/<name>/Dockerfile, smoke-tests them, then opens ONE weekly PR
#   assigned to the owner containing new binaries + README/tools.yaml updates.
#
# fields:
#   name       tool id. single-binary tools ship as x64/<name>
#   version    currently shipped version (kept in sync by automation)
#   check      how to discover the latest upstream version:
#                github-release -> GET /repos/<slug>/releases/latest
#                github-tag     -> newest tag on /repos/<slug>/tags
#                git-remote     -> git ls-remote --tags <remote> (non-GitHub hosts)
#                url            -> fetch <url>, first capture group of <pattern>
#                sourceforge    -> best_release.json of SF project
#                pinned         -> no automation (dead upstream / vendored)
#   slug       GitHub owner/repo (github-* checks)
#   prefix     tag prefix to strip (e.g. "v", "release-", "curl-")
#   remote     git URL for git-remote check
#   url/pattern for url check; url_prefix strips a leading path segment
#   project    sourceforge project id
#   lang       build language hint: go | rust | c | cxx | mixed
#   outputs    binaries produced by build/<name>/Dockerfile into /out/x64/
#              [{bin, dst}]; dst defaults to x64/<name>/<bin>, or x64/<bin>
#              when there is a single output whose bin == name
#   arm_outputs  same shape, copied from /out/arm/ (ARMv7 hard-float musl)
#   test       args appended to each output binary for the smoke test;
#              false disables; test_cmd overrides the whole command
#   experimental  known-fragile build (failure does not block the bump PR)
#   enabled    false = kept in repo but excluded from automation

tools:
  # ---------------------------------------------------------------- Go ------
  - name: 3proxy
    version: "0.9.3"
    check: {type: github-tag, slug: 3proxy/3proxy}
    lang: c
    outputs: [3proxy]
