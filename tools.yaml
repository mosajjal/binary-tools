    lang: go
    outputs: [dnspot-agent, dnspot-server]
    arm_outputs: same
    # dnspot-server opens an interactive prompt and panics without a tty; its
    # banner is the proof it actually ran, which no flag will give us
    test_cmd: '/out/x64/dnspot-agent --help >/dev/null 2>&1 && /out/x64/dnspot-server </dev/null 2>&1 | grep -qi "press ctrl"'
    test: "--version"
  - name: dnstrace
