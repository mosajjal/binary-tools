    check: {type: github-release, slug: cloudflare/boringtun, prefix: "boringtun-cli-"}
    lang: rust
    outputs:
      - bin: boringtun
        dst: boringtun
      - bin: wg-user
        dst: wg-user
        note: legacy boringtun-cli alias kept for backwards compatibility
    arm_outputs: same
    test: "--version"
  - name: brook
    version: "20260101.0"
    check: {type: github-release, slug: txthinking/brook}
    lang: go
    outputs: [brook]
    arm_outputs: same
    test: "--version"
  - name: busybox
    version: "1.38.0"
    check:
      type: url
      url: https://busybox.net/downloads/
      pattern: 'busybox-(\d+\.\d+(?:\.\d+)?)\.tar\.bz2'
    lang: c
    outputs: [busybox]
    arm_outputs: same
    test_cmd: "/out/x64/busybox echo binary-tools-smoke"
